<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="224" height="224">
  <rect width="224" height="224" fill="#ffffff"/>
  <text x="112" y="24" font-family="serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Ma trận kề &amp; Đồ thị G(V,E)</text>
  <!-- Grid Matrix -->
  <g stroke="#333333" stroke-width="1" fill="#f8fafc">
    <rect x="20" y="36" width="30" height="30"/>
    <rect x="50" y="36" width="30" height="30"/>
    <rect x="80" y="36" width="30" height="30"/>
    <rect x="20" y="66" width="30" height="30"/>
    <rect x="50" y="66" width="30" height="30"/>
    <rect x="80" y="66" width="30" height="30"/>
    <rect x="20" y="96" width="30" height="30"/>
    <rect x="50" y="96" width="30" height="30"/>
    <rect x="80" y="96" width="30" height="30"/>
  </g>
  <text x="35" y="56" font-family="monospace" font-size="14" text-anchor="middle" fill="#666">0</text>
  <text x="65" y="56" font-family="monospace" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">1</text>
  <text x="95" y="56" font-family="monospace" font-size="14" text-anchor="middle" fill="#666">0</text>
  <text x="35" y="86" font-family="monospace" font-size="14" text-anchor="middle" fill="#666">0</text>
  <text x="65" y="86" font-family="monospace" font-size="14" text-anchor="middle" fill="#666">0</text>
  <text x="95" y="86" font-family="monospace" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">1</text>
  <text x="35" y="116" font-family="monospace" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">1</text>
  <text x="65" y="116" font-family="monospace" font-size="14" text-anchor="middle" fill="#666">0</text>
  <text x="95" y="116" font-family="monospace" font-size="14" text-anchor="middle" fill="#666">0</text>
  <!-- Graph vertices and edges -->
  <line x1="150" y1="50" x2="195" y2="70" stroke="#4361ee" stroke-width="2"/>
  <line x1="195" y1="70" x2="165" y2="115" stroke="#4361ee" stroke-width="2"/>
  <line x1="165" y1="115" x2="150" y2="50" stroke="#4361ee" stroke-width="2"/>
  <circle cx="150" cy="50" r="10" fill="#4361ee"/>
  <text x="150" y="54" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">v1</text>
  <circle cx="195" cy="70" r="10" fill="#7209b7"/>
  <text x="195" y="74" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">v2</text>
  <circle cx="165" cy="115" r="10" fill="#06d6a0"/>
  <text x="165" y="119" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">v3</text>
  <!-- Formulas -->
  <text x="20" y="150" font-family="serif" font-size="13" fill="#1e293b">deg⁺(v) = Σ a[i][j]</text>
  <text x="20" y="172" font-family="serif" font-size="13" fill="#1e293b">P(A ∪ B) = P(A) + P(B) - P(AB)</text>
  <text x="20" y="194" font-family="serif" font-size="13" fill="#4361ee">C(n, k) = n! / (k!(n-k)!)</text>
  <text x="20" y="214" font-family="serif" font-size="12" fill="#64748b">Discrete Mathematics Formulation</text>
</svg>
